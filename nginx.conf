# Web-client nginx config (baked into the image at /etc/nginx/conf.d/default.conf).
#
# Routes the SPA and reverse-proxies /api/* to the gateway, PLUS the fixes needed
# for long-lived STOMP-over-WebSocket connections (chat + notifications) to
# survive from real devices on the LAN:
#   * The Spring simple broker negotiates heart-beat:0,0 (no server heartbeats), so an idle
#     chat socket has zero keepalive traffic. nginx's default proxy_read_timeout (60s) and a
#     short resolver re-resolution on a variable upstream were reaping the idle socket (~30s),
#     after which @stomp/stompjs could not reconnect (its ticket is single-use) -- so "send does
#     nothing". Long proxy timeouts + a long resolver TTL keep the socket alive.
#
# conf.d/*.conf is included in nginx's http context, so the `map` below is valid here.

# Send "Connection: upgrade" only for actual WebSocket upgrades; "close" for normal requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Resolve gateway-api via Docker's embedded DNS at request time (variable upstream) so nginx
    # does not fail to boot if the gateway isn't resolvable yet. Long TTL so DNS re-resolution
    # does not tear down established WebSocket connections.
    resolver 127.0.0.11 valid=3600s ipv6=off;

    location /api/ {
        set $backend gateway-api;
        proxy_pass http://$backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Keep idle WebSockets alive for up to an hour (broker sends no heartbeats).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # room-service's STOMP endpoint. The gateway does not route /ws/rooms, so this proxies it
    # straight to room-service. Going through nginx (rather than the browser dialling :8086)
    # keeps the socket same-origin, which is what makes it survive HTTPS: an https:// page may
    # not open a ws:// socket, and :8086 terminates no TLS of its own.
    location /ws/rooms {
        set $rooms room-service;
        proxy_pass http://$rooms:8086;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Content-hashed build assets change filename every build, so cache them hard.
    location /static/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML entrypoint -- this is what makes a new deploy show up without a manual
    # hard-refresh (otherwise browsers serve a stale index.html that points at the old JS bundle,
    # which shows up as "Can't send message -- reconnecting" from the old websocket code).
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
